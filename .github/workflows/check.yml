name: Check - Lint - Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --features migrate -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Run vendored limiter tests
        run: cargo test --locked --manifest-path vendor/twilight-http-ratelimiting/Cargo.toml

      - name: Audit dependencies
        uses: actions-rust-lang/audit@v1
